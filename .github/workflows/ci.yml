name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag hello-world-app:${{ github.sha }} \
            --tag hello-world-app:latest \
            .

      # When a registry is available (e.g. ghcr.io), push here:
      # - name: Push to registry
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #     docker tag hello-world-app:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
      #     docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
